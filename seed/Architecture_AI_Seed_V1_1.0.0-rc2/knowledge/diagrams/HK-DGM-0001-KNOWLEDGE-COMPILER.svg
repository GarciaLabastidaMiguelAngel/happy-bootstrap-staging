<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2E74B5"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0B2545" flood-opacity="0.16"/></filter>
  </defs>
  <rect width="1600" height="900" fill="#F7F9FC"/>
  <text x="800" y="65" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#0B2545">Happy — Master Knowledge Compiler</text>
  <text x="800" y="102" text-anchor="middle" font-family="Arial" font-size="18" fill="#506784">Preserva profundidad, reconcilia estado y produce un handoff gobernado</text>
  <rect x="55" y="145" width="365" height="665" rx="22" fill="#E8EEF5" stroke="#9CB3C9" stroke-width="2"/>
  <text x="238" y="190" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#0B2545">Fuentes observables</text>
  <g font-family="Arial" font-size="19" fill="#0B2545">
    <rect x="90" y="230" width="295" height="92" rx="14" fill="#FFFFFF" filter="url(#shadow)"/><text x="238" y="270" text-anchor="middle" font-weight="700">Chats y correcciones</text><text x="238" y="298" text-anchor="middle" font-size="16">con procedencia y temporalidad</text>
    <rect x="90" y="350" width="295" height="92" rx="14" fill="#FFFFFF" filter="url(#shadow)"/><text x="238" y="390" text-anchor="middle" font-weight="700">Docs, specs y diagramas</text><text x="238" y="418" text-anchor="middle" font-size="16">detalle técnico preservado</text>
    <rect x="90" y="470" width="295" height="92" rx="14" fill="#FFFFFF" filter="url(#shadow)"/><text x="238" y="510" text-anchor="middle" font-weight="700">Código, tests y Devin</text><text x="238" y="538" text-anchor="middle" font-size="16">observado vs. reportado</text>
    <rect x="90" y="590" width="295" height="92" rx="14" fill="#FFFFFF" filter="url(#shadow)"/><text x="238" y="630" text-anchor="middle" font-weight="700">Contexto bancario</text><text x="238" y="658" text-anchor="middle" font-size="16">evidencia, capabilities y riesgos</text>
  </g>
  <rect x="515" y="145" width="570" height="665" rx="22" fill="#FFFFFF" stroke="#2E74B5" stroke-width="3" filter="url(#shadow)"/>
  <text x="800" y="190" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#0B2545">Pipeline del compiler</text>
  <g font-family="Arial" text-anchor="middle">
    <rect x="610" y="235" width="380" height="82" rx="15" fill="#0B2545"/><text x="800" y="284" font-size="21" font-weight="700" fill="#FFFFFF">1. Extraer y preservar detalle</text>
    <path d="M800 318 V354" stroke="#2E74B5" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="610" y="365" width="380" height="82" rx="15" fill="#2E74B5"/><text x="800" y="414" font-size="21" font-weight="700" fill="#FFFFFF">2. Normalizar y deduplicar</text>
    <path d="M800 448 V484" stroke="#2E74B5" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="610" y="495" width="380" height="82" rx="15" fill="#2A8C82"/><text x="800" y="544" font-size="21" font-weight="700" fill="#FFFFFF">3. Correlacionar y reconciliar</text>
    <path d="M800 578 V614" stroke="#2E74B5" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="610" y="625" width="380" height="82" rx="15" fill="#506784"/><text x="800" y="660" font-size="20" font-weight="700" fill="#FFFFFF">4. Trazar, versionar</text><text x="800" y="686" font-size="18" fill="#FFFFFF">detectar contradicciones y gaps</text>
  </g>
  <rect x="1180" y="145" width="365" height="665" rx="22" fill="#EAF5F3" stroke="#74AAA4" stroke-width="2"/>
  <text x="1362" y="190" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#0B2545">Salidas gobernadas</text>
  <g font-family="Arial" font-size="19" fill="#0B2545" text-anchor="middle">
    <rect x="1215" y="230" width="295" height="92" rx="14" fill="#FFFFFF" filter="url(#shadow)"/><text x="1362" y="270" font-weight="700">Canonical snapshot</text><text x="1362" y="298" font-size="16">estado actual navegable</text>
    <rect x="1215" y="350" width="295" height="92" rx="14" fill="#FFFFFF" filter="url(#shadow)"/><text x="1362" y="390" font-weight="700">Specs + relaciones</text><text x="1362" y="418" font-size="16">contratos correlacionados</text>
    <rect x="1215" y="470" width="295" height="92" rx="14" fill="#FFFFFF" filter="url(#shadow)"/><text x="1362" y="510" font-weight="700">Status + gaps + delta</text><text x="1362" y="538" font-size="16">sin falsos VERIFIED</text>
    <rect x="1215" y="590" width="295" height="92" rx="14" fill="#FFFFFF" filter="url(#shadow)"/><text x="1362" y="630" font-weight="700">Devin Context Pack</text><text x="1362" y="658" font-size="16">handoff controlado</text>
  </g>
  <path d="M420 478 H500" stroke="#2E74B5" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M1085 478 H1165" stroke="#2E74B5" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="800" y="855" text-anchor="middle" font-family="Arial" font-size="18" fill="#506784">No transforma IDEA→DECISION, SPEC→CODE, CODE→VERIFIED ni TEST_WRITTEN→PASSED sin evidencia.</text>
</svg>

