    <rect x="615" y="400" width="370" height="100" rx="16" fill="#506784"/><text x="800" y="460" fill="#FFF" font-size="23" font-weight="700">Implementation</text>
    <rect x="150" y="400" width="370" height="100" rx="16" fill="#6B7280"/><text x="335" y="460" fill="#FFF" font-size="23" font-weight="700">Test</text>
    <rect x="395" y="635" width="370" height="100" rx="16" fill="#2A8C82"/><text x="580" y="695" fill="#FFF" font-size="23" font-weight="700">Evidence</text>
