<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#2E74B5"/></marker><filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0B2545" flood-opacity="0.18"/></filter></defs>
  <rect width="1600" height="900" fill="#F7F9FC"/>
  <text x="800" y="68" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#0B2545">Cadena de trazabilidad verificable</text>
  <text x="800" y="108" text-anchor="middle" font-family="Arial" font-size="18" fill="#506784">Cada transición exige una relación explícita; si falta, se registra GAP</text>
