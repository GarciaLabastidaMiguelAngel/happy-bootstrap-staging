    <path d="M520 230 H600"/><path d="M985 230 H1065"/><path d="M1265 280 V385"/><path d="M1080 450 H1000"/><path d="M615 450 H535"/><path d="M335 500 V570 Q335 685 380 685"/><path d="M765 685 H820"/>
