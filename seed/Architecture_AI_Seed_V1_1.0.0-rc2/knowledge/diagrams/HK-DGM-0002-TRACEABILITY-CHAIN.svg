    <rect x="150" y="180" width="370" height="100" rx="16" fill="#0B2545"/><text x="335" y="240" fill="#FFF" font-size="23" font-weight="700">Requirement</text>
    <rect x="615" y="180" width="370" height="100" rx="16" fill="#1F4D78"/><text x="800" y="240" fill="#FFF" font-size="23" font-weight="700">Decision / ADR</text>
    <rect x="1080" y="180" width="370" height="100" rx="16" fill="#2E74B5"/><text x="1265" y="240" fill="#FFF" font-size="23" font-weight="700">Specification</text>
